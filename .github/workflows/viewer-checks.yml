name: Independent viewer checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test data boundaries and honest reporting
        run: npm test

  # Separate job so `npm test` (what the routines run) still never depends on Python packages.
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install report dependencies
        run: python -m pip install reportlab pypdf
      - name: Daily report renders on one A4 page
        run: python reports/test_daily_report.py
